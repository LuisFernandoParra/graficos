<style>
  :root{
    --bg:#090c13;
    --ink:#eef1f7;
    --muted:#8f97ab;
    --blue:#3b7cf0;
    --warm:#ffb37a;
    --chip:rgba(255,255,255,.08);
    --serif:'Newsreader',Georgia,'Times New Roman',serif;
    --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
  .wrap{max-width:980px;margin:0 auto;padding:40px 20px 56px;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}

  .sub{margin:0;color:var(--muted);max-width:64ch;line-height:1.55;font-size:15px}
  .hint{color:var(--muted);font-size:14px;margin:20px 0 10px;min-height:1.5em;line-height:1.5;max-width:72ch}

  .layout{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
  .mapcol{flex:1 1 420px;min-width:0}
  .sidecol{flex:0 0 220px;min-width:200px}

  .legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:10px}
  .legend .bar{flex:0 0 130px;height:8px;border-radius:4px;background:linear-gradient(90deg,#dfe8ff,#3b6fe0 55%,#0c1f52)}

  .stage{position:relative;width:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  .stage svg{display:block;width:100%;height:auto}
  path.dept{stroke:#090c13;stroke-width:1;transition:filter .15s ease;outline:none;-webkit-tap-highlight-color:transparent}
  path.dept.has-data{cursor:pointer}
  path.dept.has-data:hover,path.dept.has-data:focus-visible{filter:brightness(1.18)}
  path.dept.no-data{cursor:default}
  path.dept:focus,path.dept:focus-visible{outline:none}
  path.dept.active{stroke:var(--warm);stroke-width:2}
  .houses{pointer-events:none;opacity:0;transition:opacity .2s ease}
  .houses.show{opacity:1}
  .wall{stroke:#090c13;stroke-width:.5;stroke-linejoin:round}
  .building{transform:scaleY(.06);opacity:0;transition:transform .5s cubic-bezier(.22,.9,.3,1),opacity .3s ease}
  .houses.show .building{transform:scaleY(1);opacity:1}
  @media (prefers-reduced-motion: reduce){
    .building{transition:none;transform:scaleY(1);opacity:1}
  }
  .zoom-glow{fill:var(--warm);opacity:.15}
  .dept-outline{stroke:var(--warm);stroke-width:1.2;fill:none;opacity:.55;pointer-events:none}

  .panel{background:var(--chip);border-radius:14px;padding:16px 18px;min-height:118px}
  .panel .ph{color:var(--muted);font-size:13.5px;line-height:1.5}
  .panel .name{font-family:var(--serif);font-weight:600;font-size:clamp(20px,2.6vw,26px);line-height:1.15;letter-spacing:-.01em;display:none}
  .panel .count{color:var(--warm);font-family:var(--serif);font-size:clamp(30px,4vw,40px);font-weight:600;line-height:1;margin-top:6px;display:none}
  .panel .era{color:var(--muted);font-size:12.5px;margin-top:6px;line-height:1.4;display:none}
  .panel.active .ph{display:none}
  .panel.active .name,.panel.active .count,.panel.active .era{display:block}

  .foot{margin:18px 0 0;color:var(--muted);font-size:13px;line-height:1.65;max-width:74ch}
  .foot + .foot{margin-top:10px}

  @media (max-width:720px){
    .layout{flex-direction:column}
    .sidecol{flex-basis:auto;width:100%}
  }
</style>

<main class="wrap">
  <h1>Presencia de Conavi en Colombia por departamento</h1>
  <p class="sub">Número de agencias antes de su fusión con Bancolombia, por departamento. Bogotá, D.C. —que no es un departamento sino un Distrito Capital— se cuenta junto con Cundinamarca. Los que están en blanco no tenían ninguna.</p>

    </div>

      <div class="panel" id="panel">

        <span class="count" id="pcount"></span>
        <span class="era" id="pera"></span>
      </div>
    </div>
  </div>

    const c0 = [214, 227, 255], c1 = [12, 31, 82];
    const r = Math.round(c0[0] + (c1[0] - c0[0]) * t);
    const g = Math.round(c0[1] + (c1[1] - c0[1]) * t);
    const b = Math.round(c0[2] + (c1[2] - c0[2]) * t);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  // Cada agencia se dibuja como un pequeño edificio en falso 3D (pared frontal, pared
  // lateral y techo a dos aguas) en vez de un ícono plano: así, cuando "crece" desde la
  // base, se lee de verdad como una extrusión que se levanta del terreno, no como un
  // dibujo apareciendo. yBase es el punto de apoyo sobre el mapa (se usa también como
  // transform-origin de la animación de crecimiento).
  function buildingGeom(x, y, s) {
    const w = s * 0.72, wallH = s * 0.46, roofH = s * 0.4;
    const depth = s * 0.36, depthY = depth * 0.55;
    const yBase = y + s * 0.28;
    const FBL = [x - w / 2, yBase], FBR = [x + w / 2, yBase];
    const FTL = [x - w / 2, yBase - wallH], FTR = [x + w / 2, yBase - wallH];
    const SBR = [FBR[0] + depth, FBR[1] - depthY], STR = [FTR[0] + depth, FTR[1] - depthY];
    const RAF = [x, yBase - wallH - roofH];
    const RAB = [RAF[0] + depth, RAF[1] - depthY];
    const pathOf = pts => 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L') + ' Z';
    return { yBase, parts: [
      { d: pathOf([FBR, SBR, STR, FTR]), fill: '#a97956' },   // pared lateral (sombra)
      { d: pathOf([FTR, RAF, RAB, STR]), fill: '#846047' },   // agua del techo lateral (más oscura)
      { d: pathOf([FBL, FBR, FTR, FTL]), fill: '#ffb37a' },    // pared frontal
      { d: pathOf([FTL, RAF, FTR]), fill: '#da9a6b' }          // agua del techo frontal
    ] };
  }

  // Las casitas se recortan a la silueta real del departamento (ver clip-path en showDept),
  // así que el tamaño puede achicarse bastante para que quepan también en los más pequeños.
  const MIN_S = 3.2, MAX_S = 20;
  // Coloca las casitas comprobando, punto por punto, que caigan de verdad dentro de la
  // silueta real del departamento (no solo dentro de su rectángulo envolvente). Empieza
  // con una cuadrícula holgada y la va apretando hasta encontrar suficientes puntos
  // interiores; en un departamento muy pequeño o alargado (como Atlántico) eso puede
  // tardar varios intentos, pero el resultado sigue siendo su propio terreno, a su escala real.
  function parsePoints(d) {
    const pts = [];
    const re = /(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g;
    let m;
    while ((m = re.exec(d))) pts.push([parseFloat(m[1]), parseFloat(m[2])]);
    return pts;
  }
  function pointInPolygon(x, y, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }
  // No basta con que el punto de apoyo de un edificio caiga dentro del departamento: si su
  // huella en falso 3D (el techo sube bastante más que la base, y la pared lateral se
  // extiende más a la derecha que a la izquierda) se sale del contorno, el clip-path lo
  // corta a la mitad y se ve "desencuadrado". Por eso exigimos que las cuatro esquinas de
  // su huella real —no un cuadrado simétrico— también queden adentro.
  function footprintCorners(step) {
    const s = step * 0.82;
    const left = -s * 0.36, right = s * 0.72, up = -s * 0.78, down = s * 0.28;
    return [[left, up], [right, up], [left, down], [right, down]];
  }
  function pointSafelyInside(x, y, poly, corners) {
    if (!pointInPolygon(x, y, poly)) return false;
    return corners.every(([dx, dy]) => pointInPolygon(x + dx, y + dy, poly));
  }
  // Escala una cadena "d" de un path alrededor de un centro (cx,cy): una transformación de
  // similitud, así que un punto que ya sabemos interior a la silueta sigue siéndolo en la
  // silueta escalada. Esto es lo que nos permite agrandar un departamento diminuto (como
  // Atlántico) para que sus casitas se vean, sin volver a caer en el error anterior de agrandar
  // solo las casitas dejando el mismo territorio real (eso no cambiaba cuántas quedaban
  // adentro). Aquí agrandamos igual el territorio y las casitas, juntos.
  function scalePathD(d, cx, cy, k) {
    return d.replace(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g, (m, xs, ys) => {
      const x = parseFloat(xs), y = parseFloat(ys);
      return (cx + (x - cx) * k).toFixed(2) + ',' + (cy + (y - cy) * k).toFixed(2);
    });
  }
  function safeId(name) { return name.replace(/[^a-zA-Z0-9_-]/g, '_'); }

  const MIN_LEGIBLE = 6.5, MAX_ZOOM = 4.5;

  function layout(dept, value) {
    if (value <= 0) return { pts: [], s: 0, zoom: 1 };
    if (!dept.poly) dept.poly = parsePoints(dept.d);
    const poly = dept.poly, bbox = dept.bbox;
    let step = Math.max(MIN_S, Math.min(MAX_S, Math.sqrt((bbox.w * bbox.h) / value) * 0.9)) / 0.82;
    let pts = [];
    for (let attempt = 0; attempt < 9; attempt++) {
      const cols = Math.max(1, Math.floor(bbox.w / step));
      const rows = Math.max(1, Math.floor(bbox.h / step));
      const x0 = dept.cx - (cols - 1) * step / 2, y0 = dept.cy - (rows - 1) * step / 2;
      const corners = footprintCorners(step);
      pts = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = x0 + c * step, y = y0 + r * step;
          if (pointSafelyInside(x, y, poly, corners)) pts.push([x, y]);
        }
      }
      if (pts.length >= value || step <= 1.8) break;
      step *= 0.8;
    }
    if (pts.length > value) {
      pts.sort((a, b) => Math.hypot(a[0] - dept.cx, a[1] - dept.cy) - Math.hypot(b[0] - dept.cx, b[1] - dept.cy));
      pts = pts.slice(0, value);
    }
    const s = step * 0.82;
    // Territorios muy chicos o alargados (como Atlántico) obligan a casitas diminutas para
    // caber. En vez de eso, cuando salen más pequeñas que el umbral legible, agrandamos el
    // recorte y las casitas por igual: el mismo terreno, más grande, mostrando lo mismo.
    const zoom = (s > 0 && s < MIN_LEGIBLE) ? Math.min(MAX_ZOOM, MIN_LEGIBLE / s) : 1;
    return { pts, s, zoom };
  }

  function el(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  /* ---------- Construcción del mapa ---------- */
  const deptEls = [];
  let activeName = null;
  let housesGroup = null;

  const clipIds = {};
  let activeZoomClip = null;

  function build() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const defs = el('defs', {});
    const gBase = el('g', { id: 'base' });
    MAP.departments.forEach((d, i) => {
      // Bogotá, D.C. se muestra fusionada con Cundinamarca: su silueta se colorea y
      // reacciona igual, pero como si fuera parte del mismo territorio de Cundinamarca.
      const effName = effectiveName(d.name);
      const value = DATA.hasOwnProperty(effName) ? DATA[effName] : 0;
      const has = value > 0;
      const path = el('path', {
        'class': 'dept ' + (has ? 'has-data' : 'no-data'),
        d: d.d,
        fill: colorFor(value),
        tabindex: has ? '0' : '-1',
        role: has ? 'button' : 'presentation'
      });
      if (has) path.setAttribute('aria-label', DISPLAY[effName] + ': ' + fmtCount(value) + ', ' + eraText());
      path.dataset.name = effName;
      gBase.appendChild(path);
      deptEls.push(path);

      // Un recorte por departamento, con su misma silueta exacta: así las casitas quedan
      // dentro de su propio terreno y no invaden el departamento vecino. Solo el dueño real
      // del nombre efectivo (no uno fusionado en él, como Bogotá en Cundinamarca) aporta su
      // polígono: las casitas de Cundinamarca se ubican en el terreno real de Cundinamarca.
      if (has && d.name === effName) {
        const clipId = 'clip-' + i;
        const clip = el('clipPath', { id: clipId });
        clip.appendChild(el('path', { d: d.d }));
        defs.appendChild(clip);
        clipIds[effName] = clipId;
      }
    });
    svg.appendChild(defs);
    svg.appendChild(gBase);
    housesGroup = el('g', { 'class': 'houses', id: 'housesGroup' });
    svg.appendChild(housesGroup);
  }

  function showDept(name) {
    const value = DATA[name] || 0;
    if (value <= 0) return;
    const dept = MAP.departments.find(d => d.name === name);
    if (!dept) return;
    activeName = name;
    deptEls.forEach(p => p.classList.toggle('active', p.dataset.name === name));

    const { pts, s, zoom } = layout(dept, value);
    while (housesGroup.firstChild) housesGroup.removeChild(housesGroup.firstChild);
    if (activeZoomClip) { activeZoomClip.remove(); activeZoomClip = null; }

    let clipRef = clipIds[name];
    let finalPts = pts, finalS = s;
    if (zoom > 1) {
      // Agrandamos el territorio (silueta de recorte) y las casitas por igual, alrededor del
      // mismo centro: siguen siendo el terreno real del departamento, solo que a mayor escala
      // para que las casitas se distingan una por una.
      finalPts = pts.map(([x, y]) => [dept.cx + (x - dept.cx) * zoom, dept.cy + (y - dept.cy) * zoom]);
      finalS = s * zoom;
      const zoomId = 'zoomclip-' + safeId(name);
      const zc = el('clipPath', { id: zoomId });
      zc.appendChild(el('path', { d: scalePathD(dept.d, dept.cx, dept.cy, zoom) }));
      svg.querySelector('defs').appendChild(zc);
      activeZoomClip = zc;
      clipRef = zoomId;
    }

    const clipped = el('g', {
      'clip-path': 'url(#' + clipRef + ')',
      'class': zoom > 1 ? 'zoomed' : ''
    });
    if (zoom > 1) {
      // Un resplandor tenue, recortado a la misma silueta agrandada, para que se lea como
      // el propio terreno "creciendo" en vez de una tarjeta flotante ajena al mapa.
      const glowR = Math.max(dept.bbox.w, dept.bbox.h) * zoom * 0.72;
      clipped.appendChild(el('circle', { cx: dept.cx, cy: dept.cy, r: glowR, 'class': 'zoom-glow' }));
      // El borde de la silueta agrandada, fuera del recorte, deja ver que es el mismo
      // territorio del departamento, ampliado — no una forma nueva.
      housesGroup.appendChild(el('path', {
        d: scalePathD(dept.d, dept.cx, dept.cy, zoom),
        'class': 'dept-outline'
      }));
    }
    // Cada edificio se levanta desde su propia base, en fila, con un pequeño desfase entre
    // uno y el siguiente: no aparecen todos a la vez, sino como una hilera de agencias
    // brotando del departamento una tras otra.
    const n = finalPts.length;
    const totalWindow = n > 1 ? Math.min(650, (n - 1) * 32) : 0;
    finalPts.forEach(([x, y], i) => {
      const { yBase, parts } = buildingGeom(x, y, finalS);
      const delay = n > 1 ? (i / (n - 1)) * totalWindow : 0;
      const b = el('g', {
        'class': 'building',
        style: 'transform-origin:' + x.toFixed(1) + 'px ' + yBase.toFixed(1) + 'px; transition-delay:' + delay.toFixed(0) + 'ms'
      });
      parts.forEach(part => b.appendChild(el('path', { d: part.d, fill: part.fill, 'class': 'wall' })));
      clipped.appendChild(b);
    });
    housesGroup.appendChild(clipped);
    requestAnimationFrame(() => housesGroup.classList.add('show'));

    panel.classList.add('active');
    nameEl.textContent = DISPLAY[name];
    countEl.textContent = fmtCount(value);
    eraEl.textContent = eraText(name);
  }

  function clearDept() {
    activeName = null;
    deptEls.forEach(p => p.classList.remove('active'));
    housesGroup.classList.remove('show');
    panel.classList.remove('active');
  }

  /* ---------- Interacción: hover en computador, toque en celular ---------- */
  function attachEvents() {
    if (coarse) {
      svg.addEventListener('click', e => {
        const p = e.target.closest('path.dept');
        if (!p || !p.classList.contains('has-data')) { clearDept(); return; }
        const name = p.dataset.name;
        if (name === activeName) clearDept(); else showDept(name);
      });
    } else {
      deptEls.forEach(p => {
        if (!p.classList.contains('has-data')) return;
        p.addEventListener('pointerenter', () => showDept(p.dataset.name));
        p.addEventListener('focus', () => showDept(p.dataset.name));
      });
      svg.addEventListener('pointerleave', clearDept);
      svg.addEventListener('focusout', e => {
        if (!svg.contains(e.relatedTarget)) clearDept();
      });
    }
    svg.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && document.activeElement.classList.contains('dept')) {
        e.preventDefault();
        const name = document.activeElement.dataset.name;
        if (coarse || name !== activeName) showDept(name); else clearDept();
      }
      if (e.key === 'Escape') clearDept();
    });
  }

  phEl.textContent = coarse
    ? 'Toca una zona de color para ver cuántas agencias de Conavi tenía. Las que están en blanco no tenían ninguna.'
    : 'Pasa el cursor por una zona de color para ver cuántas agencias de Conavi tenía. Las que están en blanco no tenían ninguna.';
  $('hint').textContent = coarse
    ? 'El color indica cuánta presencia tenía Conavi en cada departamento. Toca uno con color para ver sus agencias, una por una.'
    : 'El color indica cuánta presencia tenía Conavi en cada departamento. Pasa el cursor por uno con color para ver sus agencias, una por una.';

  build();
  attachEvents();
})();
</script>
</body>
</html>
